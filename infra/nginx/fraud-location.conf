# Real-Time Fraud Detection demo — proxied to the FastAPI app (fraud_api container, bound to
# 127.0.0.1:8002). Mirrors the /projects/rag/ block already in
# portfolio-website/infra/nginx/matheusramos.dev.conf.
#
# The trailing slash on both the location and proxy_pass strips the /projects/fraud/ prefix
# before forwarding, so the app sees plain "/", "/stats", "/stream", "/style.css" etc. The
# dashboard's own asset/fetch/EventSource URLs are relative, so it works under any prefix.
#
# Merge these two location blocks into the existing
#   server { listen 443 ssl; server_name matheusramos.dev; ... }
# block of that repo's infra/nginx/matheusramos.dev.conf (a separate git repository), then
# follow its "Updating the Nginx config" steps (scp, `nginx -t`, reload). Only ADDS blocks —
# nothing existing is changed.

location = /projects/fraud {
    return 301 /projects/fraud/;
}

location /projects/fraud/ {
    proxy_pass http://127.0.0.1:8002/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # CF-Connecting-IP (Cloudflare) já chega da requisição original e é repassado por padrão;
    # é o que o rate limiter da API usa para identificar o visitante real.

    # Server-Sent Events (/stream): nada de buffer/cache, conexão longa.
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection '';
    chunked_transfer_encoding off;
    proxy_read_timeout 300s;
}
